<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ title }}</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference"></script>
    <script>
      Scalar.createApiReference('#app', {
        url: '{{ openapi_url|escapejs }}',
        theme: 'default',
        persistAuth: true,
        hideClientButton: false,
        defaultHttpClient: {
          targetKey: 'js',
          clientKey: 'fetch',
        },
        authentication: {
          // Do not pre-select an empty Bearer token — that caused
          // "Authorization: Bearer" with no credentials (401).
          preferredSecurityScheme: 'passwordAuth',
          securitySchemes: {
            passwordAuth: {
              flows: {
                password: {
                  username: 'nurse@hospital.com',
                  // Leave password blank so the user types it (or fill for local testing)
                  password: 'password123',
                },
              },
            },
          },
        },
      });
    </script>
  </body>
</html>
